services:
  we-mp-rss:
    image: ${WE_MPRSS_IMAGE:-we-mp-rss:markitdown}
    container_name: we-mp-rss
    restart: unless-stopped
    ports:
      - "8001:8001"
    environment:
      - USERNAME=${WE_MPRSS_USERNAME:-admin}
      - PASSWORD=${WE_MPRSS_PASSWORD:-admin@123}
      - TZ=${TZ:-Asia/Shanghai}
    volumes:
      - ${WE_MPRSS_DATA_DIR:-../data}:/app/data
      - ${WE_MPRSS_CONFIG_FILE:-./we-mp-rss.config.yaml}:/app/config.yaml:ro

volumes:
  db_data:

networks:
  we-mp-rss:


